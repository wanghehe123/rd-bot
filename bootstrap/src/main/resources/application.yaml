server:
  port: ${SERVER_PORT:18080}
spring:
  application:
    name: rd-bot
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/rdbot?client_encoding=UTF8}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${POSTGRES_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${POSTGRES_MINIMUM_IDLE:2}
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.wish.rd.rag.retrieval: ${RD_RAG_RETRIEVAL_LOG_LEVEL:INFO}

rag:
  default:
    collection-name: rd_bot_collection
    dimension: 1536
    metric-type: COSINE
  query-rewrite:
    enabled: true
  memory:
    history-keep-turns: 8
    summary-enabled: false
    summary-start-turns: 9
    summary-max-chars: 200
    title-max-length: 30
  rate-limit:
    global:
      enabled: false
      executor-size: 4
      max-concurrent: 4
      max-wait-seconds: 20
      lease-seconds: 600
      poll-interval-ms: 200

rustfs:
  url: ${RUSTFS_URL:http://localhost:9000}
  bucket: ${RUSTFS_BUCKET:biz}
  access-key-id: ${RUSTFS_ACCESS_KEY_ID:rustfsadmin}
  secret-access-key: ${RUSTFS_SECRET_ACCESS_KEY:rustfsadmin}

rd:
  evaluation:
    enabled: ${RD_EVAL_ENABLED:true}
    repository-root: ${RD_EVAL_REPOSITORY_ROOT:${user.dir}}
    output-root: ${RD_EVAL_OUTPUT_ROOT:qa-runs/evaluation}
    dataset-root: ${RD_EVAL_DATASET_ROOT:scripts/evaluation/datasets}
    rag-log-root: ${RD_EVAL_RAG_LOG_ROOT:logs}
    python-executable: ${RD_EVAL_PYTHON_EXECUTABLE:python3}
    ragas-python-executable: ${RD_EVAL_RAGAS_PYTHON_EXECUTABLE:}
    default-base-url: ${RD_EVAL_DEFAULT_BASE_URL:http://127.0.0.1:18080}
    parallelism: ${RD_EVAL_PARALLELISM:2}
    max-log-chars: ${RD_EVAL_MAX_LOG_CHARS:200000}
    coding-benchmark-root: ${CODING_BENCHMARK_ROOT:/Volumes/WishDisk/codes/swe/public-prep/snapshots}
    coding-benchmark-prep-root: ${CODING_BENCHMARK_PREP_ROOT:/Volumes/WishDisk/codes/swe/public-prep}
    coding-benchmark:
      # docker runs the isolated Agent/Oracle containers; fake runs a container-free control-plane rehearsal
      executor: ${CODING_BENCHMARK_EXECUTOR:docker}
      oracle-image: ${CODING_BENCHMARK_ORACLE_IMAGE:rd-bot/coding-eval-oracle@sha256:904063462a3f3eb74902fdf38283f18d66f2ce908fffe00381b68ad8ee90b27d}
      model-provider:
        name: ${CODING_BENCHMARK_MODEL_PROVIDER:opencode-go}
        base-url: ${CODING_BENCHMARK_MODEL_BASE_URL:https://opencode.ai/zen/go/v1}
        model: ${CODING_BENCHMARK_MODEL:deepseek-v4-flash}
        api-key-env: ${CODING_BENCHMARK_MODEL_API_KEY_ENV:OPENCODE_API_KEY}
        protocol: ${CODING_BENCHMARK_MODEL_PROTOCOL:openai-chat-completions}
        relay-image: ${CODING_BENCHMARK_RELAY_IMAGE:rd-bot/coding-eval-relay:local}
        allowed-paths:
          - /chat/completions
          - /v1/chat/completions
          - /models
          - /v1/models
        fallback:
          name: ${CODING_BENCHMARK_FALLBACK_PROVIDER:deepseek}
          base-url: ${CODING_BENCHMARK_FALLBACK_BASE_URL:https://api.deepseek.com}
          model: ${CODING_BENCHMARK_FALLBACK_MODEL:deepseek-v4-flash}
          api-key-env: ${CODING_BENCHMARK_FALLBACK_API_KEY_ENV:DEEPSEEK_API_KEY}
  ai-review:
    enabled: ${RD_AI_REVIEW_ENABLED:false}
    base-url: ${RD_AI_REVIEW_BASE_URL:https://api.longcat.chat/anthropic}
    model: ${RD_AI_REVIEW_MODEL:}
    auth-token-env: ${RD_AI_REVIEW_AUTH_TOKEN_ENV:LONGCAT_API_KEY}
    auth-mode: ${RD_AI_REVIEW_AUTH_MODE:authorization-bearer}
    disable-thinking: ${RD_AI_REVIEW_DISABLE_THINKING:true}
    max-tokens: ${RD_AI_REVIEW_MAX_TOKENS:4096}
    max-input-chars: ${RD_AI_REVIEW_MAX_INPUT_CHARS:80000}
    timeout: ${RD_AI_REVIEW_TIMEOUT:90s}
  requirement-delivery:
    max-attempts: ${RD_REQUIREMENT_DELIVERY_MAX_ATTEMPTS:3}
    lease-millis: ${RD_REQUIREMENT_DELIVERY_LEASE_MILLIS:600000}
    recovery-interval-millis: ${RD_REQUIREMENT_DELIVERY_RECOVERY_INTERVAL_MILLIS:30000}
    scheduling:
      max-per-project: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_MAX_PER_PROJECT:2}
      max-docker: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_MAX_DOCKER:4}
      max-browser-qa: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_MAX_BROWSER_QA:2}
      max-provider: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_MAX_PROVIDER:8}
      max-per-provider: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_MAX_PER_PROVIDER:2}
      batch-size: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_BATCH_SIZE:8}
      aging-millis: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_AGING_MILLIS:60000}
      command-deadline-millis: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_COMMAND_DEADLINE_MILLIS:3600000}
      default-provider-id: ${RD_REQUIREMENT_DELIVERY_SCHEDULING_DEFAULT_PROVIDER_ID:local-provider}
      project-weights: {}
    handoff:
      max-tokens: ${RD_REQUIREMENT_DELIVERY_HANDOFF_MAX_TOKENS:4000}
  financial:
    cny-per-usd: ${RD_FINANCIAL_CNY_PER_USD:7.20}
  task-draft:
    enabled: ${RD_TASK_DRAFT_ENABLED:false}
    base-url: ${RD_TASK_DRAFT_BASE_URL:https://api.longcat.chat/anthropic}
    model: ${RD_TASK_DRAFT_MODEL:}
    auth-token-env: ${RD_TASK_DRAFT_AUTH_TOKEN_ENV:LONGCAT_API_KEY}
    max-tokens: ${RD_TASK_DRAFT_MAX_TOKENS:2048}
  thread-pools:
    requirement-delivery:
      core-size: ${RD_THREAD_REQUIREMENT_CORE_SIZE:2}
      max-size: ${RD_THREAD_REQUIREMENT_MAX_SIZE:4}
      queue-capacity: ${RD_THREAD_REQUIREMENT_QUEUE_CAPACITY:100}
      keep-alive-seconds: ${RD_THREAD_REQUIREMENT_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${RD_THREAD_REQUIREMENT_AWAIT_TERMINATION_SECONDS:30}
      thread-name-prefix: rd-requirement-
    executor-io:
      core-size: ${RD_THREAD_EXECUTOR_IO_CORE_SIZE:4}
      max-size: ${RD_THREAD_EXECUTOR_IO_MAX_SIZE:8}
      queue-capacity: ${RD_THREAD_EXECUTOR_IO_QUEUE_CAPACITY:200}
      keep-alive-seconds: ${RD_THREAD_EXECUTOR_IO_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${RD_THREAD_EXECUTOR_IO_AWAIT_TERMINATION_SECONDS:30}
      thread-name-prefix: rd-executor-io-
    repair-queue:
      core-size: ${RD_THREAD_REPAIR_QUEUE_CORE_SIZE:2}
      max-size: ${RD_THREAD_REPAIR_QUEUE_MAX_SIZE:4}
      queue-capacity: ${RD_THREAD_REPAIR_QUEUE_QUEUE_CAPACITY:200}
      keep-alive-seconds: ${RD_THREAD_REPAIR_QUEUE_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${RD_THREAD_REPAIR_QUEUE_AWAIT_TERMINATION_SECONDS:30}
      thread-name-prefix: rd-repair-queue-
    ingestion:
      core-size: ${RD_THREAD_INGESTION_CORE_SIZE:2}
      max-size: ${RD_THREAD_INGESTION_MAX_SIZE:4}
      queue-capacity: ${RD_THREAD_INGESTION_QUEUE_CAPACITY:100}
      keep-alive-seconds: ${RD_THREAD_INGESTION_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${RD_THREAD_INGESTION_AWAIT_TERMINATION_SECONDS:30}
      thread-name-prefix: rd-ingestion-
    maintenance:
      core-size: ${RD_THREAD_MAINTENANCE_CORE_SIZE:1}
      max-size: ${RD_THREAD_MAINTENANCE_MAX_SIZE:2}
      queue-capacity: ${RD_THREAD_MAINTENANCE_QUEUE_CAPACITY:50}
      keep-alive-seconds: ${RD_THREAD_MAINTENANCE_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${RD_THREAD_MAINTENANCE_AWAIT_TERMINATION_SECONDS:30}
      thread-name-prefix: rd-maintenance-
    scheduler:
      pool-size: ${RD_THREAD_SCHEDULER_POOL_SIZE:2}
      await-termination-seconds: ${RD_THREAD_SCHEDULER_AWAIT_TERMINATION_SECONDS:30}
      thread-name-prefix: rd-scheduler-
  distributed-lock:
    mode: ${RD_DISTRIBUTED_LOCK_MODE:redisson}
  rag:
    retrieval-log:
      enabled: ${RD_RAG_RETRIEVAL_LOG_ENABLED:true}
      path: ${RD_RAG_RETRIEVAL_LOG_PATH:logs/rag-retrieval.jsonl}
    knowledge-provider-mode: ${RD_RAG_KNOWLEDGE_PROVIDER_MODE:LOCAL}
    navigator:
      max-rounds: ${RD_RAG_NAVIGATOR_MAX_ROUNDS:3}
      l0-candidates: ${RD_RAG_NAVIGATOR_L0_CANDIDATES:20}
      l1-expansions: ${RD_RAG_NAVIGATOR_L1_EXPANSIONS:6}
      l2-expansions: ${RD_RAG_NAVIGATOR_L2_EXPANSIONS:3}
      max-remote-calls: ${RD_RAG_NAVIGATOR_MAX_REMOTE_CALLS:15}
      token-budget: ${RD_RAG_NAVIGATOR_TOKEN_BUDGET:8000}
      time-budget: ${RD_RAG_NAVIGATOR_TIME_BUDGET:20s}
  knowledge:
    store: ${RD_KNOWLEDGE_STORE:postgres}
    projection:
      mode: ${RD_KNOWLEDGE_PROJECTION_MODE:OFF}
      provider: ${RD_KNOWLEDGE_PROJECTION_PROVIDER:openviking}
      tick-millis: ${RD_OPENVIKING_TICK_MILLIS:3000}
      worker:
        concurrency: ${RD_OPENVIKING_WORKER_CONCURRENCY:2}
        batch-size: ${RD_OPENVIKING_WORKER_BATCH_SIZE:10}
        lease-millis: ${RD_OPENVIKING_WORKER_LEASE_MILLIS:120000}
        max-attempts: ${RD_OPENVIKING_MAX_ATTEMPTS:8}
        retry-backoff-millis: ${RD_OPENVIKING_RETRY_BACKOFF_MILLIS:2000}
        max-retry-backoff-millis: ${RD_OPENVIKING_MAX_RETRY_BACKOFF_MILLIS:300000}
      poll:
        interval-millis: ${RD_OPENVIKING_POLL_INTERVAL_MILLIS:3000}
        max-interval-millis: ${RD_OPENVIKING_POLL_MAX_INTERVAL_MILLIS:60000}
        lease-millis: ${RD_OPENVIKING_POLL_LEASE_MILLIS:15000}
        unknown-outcome-timeout-millis: ${RD_OPENVIKING_UNKNOWN_TIMEOUT_MILLIS:1800000}
      reconcile:
        enabled: ${RD_OPENVIKING_RECONCILE_ENABLED:false}
        interval-millis: ${RD_OPENVIKING_RECONCILE_INTERVAL_MILLIS:300000}
      backfill:
        enabled: ${RD_OPENVIKING_BACKFILL_ENABLED:false}
        interval-millis: ${RD_OPENVIKING_BACKFILL_INTERVAL_MILLIS:60000}
        batch-size: ${RD_OPENVIKING_BACKFILL_BATCH_SIZE:20}
        max-in-flight: ${RD_OPENVIKING_BACKFILL_MAX_IN_FLIGHT:200}
        knowledge-base-allowlist: ${RD_OPENVIKING_BACKFILL_KNOWLEDGE_BASE_ALLOWLIST:}
  openviking:
    enabled: ${RD_OPENVIKING_ENABLED:false}
    base-url: ${RD_OPENVIKING_BASE_URL:http://127.0.0.1:1933}
    api-key-env: ${RD_OPENVIKING_API_KEY_ENV:OPENVIKING_API_KEY}
    owned-root: ${RD_OPENVIKING_OWNED_ROOT:viking://resources/rd-bot/}
    connect-timeout-millis: ${RD_OPENVIKING_CONNECT_TIMEOUT_MILLIS:3000}
    request-timeout-millis: ${RD_OPENVIKING_REQUEST_TIMEOUT_MILLIS:30000}
  storage:
    mode: ${RD_STORAGE_MODE:s3}
  redis-stream:
    repair:
      stream-key: ${RD_REDIS_STREAM_REPAIR_STREAM_KEY:rd-bot:repair:tickets}
      consumer-group: ${RD_REDIS_STREAM_REPAIR_CONSUMER_GROUP:rd-bot-repair-workers}
      consumer-name-base: ${RD_REDIS_STREAM_REPAIR_CONSUMER_NAME_BASE:rd-bot-repair}
      consumer-concurrency: ${RD_REDIS_STREAM_REPAIR_CONSUMER_CONCURRENCY:2}
      poll-timeout-millis: ${RD_REDIS_STREAM_REPAIR_POLL_TIMEOUT_MILLIS:1000}
      batch-size: ${RD_REDIS_STREAM_REPAIR_BATCH_SIZE:10}
      pending-claim-idle-millis: ${RD_REDIS_STREAM_REPAIR_PENDING_CLAIM_IDLE_MILLIS:60000}
      failure-backoff-millis: ${RD_REDIS_STREAM_REPAIR_FAILURE_BACKOFF_MILLIS:1000}
      max-retry-attempts: ${RD_REDIS_STREAM_REPAIR_MAX_RETRY_ATTEMPTS:3}
  repair:
    queue:
      mode: ${RD_REPAIR_QUEUE_MODE:redis-stream}
    ticket:
      provider: ${RD_REPAIR_TICKET_PROVIDER:feishu-im}
      auto-execute:
        enabled: ${RD_REPAIR_TICKET_AUTO_EXECUTE_ENABLED:true}
      ingestion:
        default-source: ${RD_REPAIR_TICKET_DEFAULT_SOURCE:feishu}
    acceptance:
      enabled: ${RD_REPAIR_ACCEPTANCE_ENABLED:true}
      max-steps: ${RD_REPAIR_ACCEPTANCE_MAX_STEPS:20}
      write-operations-enabled: ${RD_REPAIR_ACCEPTANCE_WRITE_OPERATIONS_ENABLED:true}
      environment-allowlist:
        - local
        - sit
  executor:
    agent-runtime:
      enabled: ${RD_EXECUTOR_AGENT_RUNTIME_ENABLED:false}
      mutation-token: ${RD_AGENT_RUNTIME_MUTATION_TOKEN:}
    pi:
      image: ${RD_EXECUTOR_PI_IMAGE:rd-bot/pi-agent:local}
      qa-image: ${RD_EXECUTOR_PI_QA_IMAGE:rd-bot/pi-agent-qa:local}
      command:
        - node
        - /opt/rd-pi-bridge/src/rd-pi-bridge.mjs
      network-mode: ${RD_EXECUTOR_PI_NETWORK_MODE:bridge}
      remove-after-exit: ${RD_EXECUTOR_PI_REMOVE_AFTER_EXIT:true}
      allow-privileged: ${RD_EXECUTOR_PI_ALLOW_PRIVILEGED:false}
      # Relay is the safe production default. Credentialed Pi runs must use the
      # task-local internal network; only the hardened sidecar joins this egress network.
      credential-relay-enabled: ${RD_EXECUTOR_PI_CREDENTIAL_RELAY_ENABLED:true}
      credential-relay-url: ${RD_EXECUTOR_PI_CREDENTIAL_RELAY_URL:http://host.docker.internal:18080/internal/pi/credential-relay/proxy}
      execution-timeout-millis: ${RD_EXECUTOR_PI_EXECUTION_TIMEOUT_MILLIS:3600000}
      bash-command-timeout-millis: ${RD_EXECUTOR_PI_BASH_COMMAND_TIMEOUT_MILLIS:900000}
      raw-event-max-bytes: ${RD_EXECUTOR_PI_MAX_RAW_EVENT_BYTES:16777216}
      # request-protocol-version: v1  # set v2 only for P3-V3 sentinel rehearsal
      # context-policy-mode: LEGACY_OBSERVE_ONLY  # set ROOT_ONLY only for sentinel / explicit rehearsal

      resources:
        enabled: ${RD_EXECUTOR_PI_RESOURCES_ENABLED:false}
        approved-cache-root: ${RD_EXECUTOR_PI_APPROVED_CACHE_ROOT:}
      artifact-archive:
        # Raw/session persistence is opt-in until retention and restricted-access values are supplied.
        enabled: ${RD_EXECUTOR_PI_ARTIFACT_ARCHIVE_ENABLED:false}
        raw-bucket: ${RD_EXECUTOR_PI_RAW_ARTIFACT_BUCKET:}
        session-bucket: ${RD_EXECUTOR_PI_SESSION_ARTIFACT_BUCKET:}
        raw-retention-millis: ${RD_EXECUTOR_PI_RAW_RETENTION_MILLIS:0}
        session-retention-millis: ${RD_EXECUTOR_PI_SESSION_RETENTION_MILLIS:0}
        max-raw-bytes: ${RD_EXECUTOR_PI_MAX_RAW_ARTIFACT_BYTES:16777216}
        max-session-file-bytes: ${RD_EXECUTOR_PI_MAX_SESSION_FILE_BYTES:16777216}
        max-session-files: ${RD_EXECUTOR_PI_MAX_SESSION_FILES:128}
        cleanup-interval-millis: ${RD_EXECUTOR_PI_PRIVATE_ARTIFACT_CLEANUP_INTERVAL_MILLIS:60000}
    mock:
      enabled: ${RD_EXECUTOR_MOCK_ENABLED:false}
    repository:
      owner: ${RD_EXECUTOR_REPOSITORY_OWNER:example-owner}
      name: ${RD_EXECUTOR_REPOSITORY_NAME:example-repo}
      url: ${RD_EXECUTOR_REPOSITORY_URL:https://github.com/example-owner/example-repo.git}
      base-branch: ${RD_EXECUTOR_REPOSITORY_BASE_BRANCH:main}
      work-branch-prefix: ${RD_EXECUTOR_REPOSITORY_WORK_BRANCH_PREFIX:repair/}
    docker:
      enabled: ${RD_EXECUTOR_DOCKER_ENABLED:true}
      image: ${RD_EXECUTOR_DOCKER_IMAGE:rd-bot/claude-code:local}
      qa-image: ${RD_EXECUTOR_DOCKER_QA_IMAGE:rd-bot/claude-code-qa:local}
      workspace-root: ${RD_EXECUTOR_DOCKER_WORKSPACE_ROOT:/tmp/rd-bot/repair-workspaces}
      runtime-profiles:
        # Uploading a Dockerfile builds untrusted operator input. Keep mutations disabled until an operator supplies
        # this capability token through the environment; the UI keeps it only in memory for the current dialog.
        upload-token: ${RD_RUNTIME_PROFILE_UPLOAD_TOKEN:}
      command: claude
      yolo-flag: --dangerously-skip-permissions
      output-format: stream-json
      network-mode: bridge
      remove-after-exit: true
      timeout-alert-millis: 1800000
      budget-alert-cny: 36.00
      circuit-breaker:
        enabled: ${RD_EXECUTOR_DOCKER_CIRCUIT_BREAKER_ENABLED:true}
        failure-threshold: ${RD_EXECUTOR_DOCKER_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
        open-duration-millis: ${RD_EXECUTOR_DOCKER_CIRCUIT_BREAKER_OPEN_DURATION_MILLIS:60000}
        state-store: ${RD_EXECUTOR_DOCKER_CIRCUIT_BREAKER_STATE_STORE:redis}
      security:
        enabled: ${RD_EXECUTOR_DOCKER_SECURITY_ENABLED:true}
        repository-urls:
          - ${RD_EXECUTOR_DOCKER_ALLOWED_REPOSITORY_URL:https://github.com/example-owner/example-repo.git}
        repositories:
          - ${RD_EXECUTOR_DOCKER_ALLOWED_REPOSITORY:example-owner/example-repo}
        base-branches:
          - ${RD_EXECUTOR_DOCKER_ALLOWED_BASE_BRANCH:main}
        work-branches:
          - ${RD_EXECUTOR_DOCKER_ALLOWED_WORK_BRANCH:repair/*}
          - ${RD_EXECUTOR_DOCKER_ALLOWED_REQUIREMENT_BRANCH:requirement/*}
      git:
        enabled: ${RD_EXECUTOR_DOCKER_GIT_ENABLED:true}
        user-name: ${RD_EXECUTOR_DOCKER_GIT_USER_NAME:RD-Bot}
        user-email: ${RD_EXECUTOR_DOCKER_GIT_USER_EMAIL:rd-bot@example.local}
        timeout-seconds: ${RD_EXECUTOR_DOCKER_GIT_TIMEOUT_SECONDS:120}
      providers:
        - name: long-cat
          protocol: ${LONGCAT_PROTOCOL:anthropic-compatible}
          base-url: ${LONGCAT_ANTHROPIC_BASE_URL:https://api.longcat.chat/anthropic}
          auth-token-env: ${RD_CLAUDE_AUTH_TOKEN_ENV:LONGCAT_API_KEY}
          model: ${LONGCAT_CLAUDE_MODEL:LongCat-2.0}
          default-opus-model: ${LONGCAT_CLAUDE_OPUS_MODEL:LongCat-2.0}
          default-sonnet-model: ${LONGCAT_CLAUDE_SONNET_MODEL:LongCat-2.0}
          default-haiku-model: ${LONGCAT_CLAUDE_HAIKU_MODEL:LongCat-2.0}
          subagent-model: ${LONGCAT_CLAUDE_SUBAGENT_MODEL:LongCat-2.0}
          effort-level: ${LONGCAT_CLAUDE_EFFORT_LEVEL:max}
          extra-env:
            RD_CLAUDE_LOCAL_FALLBACK_ENABLED: ${RD_CLAUDE_LOCAL_FALLBACK_ENABLED:true}
        - name: minimax
          protocol: ${MINIMAX_PROTOCOL:openai-chat-completions}
          base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com/v1}
          api-key-env: ${MINIMAX_API_KEY_ENV:MINIMAX_API_KEY}
          model: ${MINIMAX_MODEL:MiniMax-M3}
          default-opus-model: ${MINIMAX_OPUS_MODEL:MiniMax-M3}
          default-sonnet-model: ${MINIMAX_SONNET_MODEL:MiniMax-M3}
          default-haiku-model: ${MINIMAX_HAIKU_MODEL:MiniMax-M3}
          subagent-model: ${MINIMAX_SUBAGENT_MODEL:MiniMax-M3}
          effort-level: ${MINIMAX_EFFORT_LEVEL:max}
    openai-chat:
      enabled: ${RD_EXECUTOR_OPENAI_CHAT_ENABLED:false}
      provider-name: ${MINIMAX_PROVIDER_NAME:minimax}
      base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com/v1}
      api-key-env: ${MINIMAX_API_KEY_ENV:MINIMAX_API_KEY}
      model: ${MINIMAX_MODEL:MiniMax-M3}
      protocol: ${RD_EXECUTOR_OPENAI_CHAT_PROTOCOL:openai-chat-completions}
      timeout: ${RD_EXECUTOR_OPENAI_CHAT_TIMEOUT:60s}
  github:
    merge-sync:
      enabled: ${RD_GITHUB_MERGE_SYNC_ENABLED:true}
      poll-interval-millis: ${RD_GITHUB_MERGE_SYNC_POLL_INTERVAL_MILLIS:30000}
    code-platform:
      mode: ${RD_GITHUB_CODE_PLATFORM_MODE:real}
      allowed-repositories: []
      auth-mode: ${RD_GITHUB_CODE_PLATFORM_AUTH_MODE:GH_CLI_LOCAL_SMOKE}
      gh-cli-command: ${RD_GITHUB_CODE_PLATFORM_GH_CLI_COMMAND:gh}
      app-id: ${GITHUB_APP_ID:}
      installation-id: ${GITHUB_INSTALLATION_ID:}
      private-key-ref: ${GITHUB_PRIVATE_KEY_REF:}
      pat-token: ${GITHUB_PAT:${GH_TOKEN:}}
  ticket:
    write-back:
      enabled: ${RD_TICKET_WRITE_BACK_ENABLED:true}
      mode: ${RD_TICKET_WRITE_BACK_MODE:feishu-im}
  feishu:
    im:
      enabled: ${FEISHU_IM_ENABLED:true}
      base-url: ${FEISHU_BASE_URL:https://open.feishu.cn}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      require-at-mention: ${FEISHU_IM_REQUIRE_AT_MENTION:false}
      local-listener:
        enabled: ${FEISHU_IM_LOCAL_LISTENER_ENABLED:true}
        command: ${FEISHU_IM_LOCAL_LISTENER_COMMAND:lark-cli}
        profile: ${FEISHU_IM_LOCAL_LISTENER_PROFILE:}
        event-key: ${FEISHU_IM_LOCAL_LISTENER_EVENT_KEY:im.message.receive_v1}
        identity: ${FEISHU_IM_LOCAL_LISTENER_IDENTITY:bot}
        restart-delay-millis: ${FEISHU_IM_LOCAL_LISTENER_RESTART_DELAY_MILLIS:5000}
        write-back-via-cli: ${FEISHU_IM_LOCAL_LISTENER_WRITE_BACK_VIA_CLI:true}
      write-back:
        enabled: ${FEISHU_IM_WRITE_BACK_ENABLED:true}
      alert:
        enabled: ${FEISHU_IM_ALERT_ENABLED:false}
        chat-id: ${FEISHU_IM_ALERT_CHAT_ID:}
        admin-base-url: ${RD_ADMIN_BASE_URL:http://127.0.0.1:5173}
      http:
        connect-timeout-millis: 3000
        request-timeout-millis: 10000
    helpdesk:
      enabled: false
      write-back:
        enabled: false
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      helpdesk-id: ${FEISHU_HELPDESK_ID:}
      helpdesk-token: ${FEISHU_HELPDESK_TOKEN:}
      http:
        connect-timeout-millis: 3000
        request-timeout-millis: 10000
      field-mapping:
        problemSystem: problemSystem
        symptom: symptom
        triggerWay: triggerWay
        logs: logs
        repository: repository
        branch: branch
        expectedResult: expectedResult
        actualResult: actualResult
  ai:
    provider:
      name: ${RD_AI_PROVIDER_NAME:long-cat}
      base-url: ${RD_AI_PROVIDER_BASE_URL:https://api.longcat.chat/anthropic}
      api-key: ${LONGCAT_API_KEY:}
    chat:
      default-model: ${RD_AI_CHAT_DEFAULT_MODEL:LongCat-2.0}
      deep-thinking-model: ${RD_AI_CHAT_DEEP_THINKING_MODEL:LongCat-2.0}
    embedding:
      default-model: ${RD_AI_EMBEDDING_DEFAULT_MODEL:bge-m3}
    rerank:
      default-model: ${RD_AI_RERANK_DEFAULT_MODEL:bge-reranker-v2-m3}
    stream:
      message-chunk-size: 256
