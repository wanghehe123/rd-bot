name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license-and-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: License metadata is MIT everywhere
        run: |
          grep -q "MIT License" LICENSE
          grep -q "<name>MIT License</name>" pom.xml
          grep -q '"license": "MIT"' frontend/package.json
          grep -q '"license": "MIT"' bootstrap/src/main/resources/executor/pi/package.json
          ! grep -rn "Apache License" README.md README.zh-CN.md
      - name: No committed secrets or personal entry points
        run: |
          ! grep -rnE "BEGIN (RSA|OPENSSH|EC) PRIVATE KEY" --include='*.java' --include='*.yaml' --include='*.yml' --include='*.sh' .
          ! grep -rnE "StrictHostKeyChecking=no|url\..*\.insteadOf" deploy/ README.md README.zh-CN.md
          ! git grep -nE "local-agent-runtime" -- bootstrap/src frontend/src deploy/

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: osv-scanner over the release tree (G10 re-check)
        run: |
          go install github.com/google/osv-scanner/v2@latest || pip install osv-scanner 2>/dev/null || true
          $(go env GOPATH 2>/dev/null)/bin/osv-scanner scan source -r --allow-no-lockfiles \
            --experimental-exclude .worktrees --format table . || \
            npx --yes osv-scanner@latest scan source -r --allow-no-lockfiles \
            --experimental-exclude .worktrees .

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Focused open-source core suite
        run: env -u SPRING_CONFIG_ADDITIONAL_LOCATION ./scripts/test-open-source-core.sh

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && node --experimental-strip-types --test test/*.test.ts
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build

  pi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bootstrap/src/main/resources/executor/pi/package-lock.json
      - run: cd bootstrap/src/main/resources/executor/pi && npm ci && npm test

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Pi, QA and application images (unique CI tag)
        run: |
          docker build -t rd-bot/pi-agent:ci-test bootstrap/src/main/resources/executor/pi
          docker build --build-arg PI_BASE_IMAGE=rd-bot/pi-agent:ci-test \
            -t rd-bot/pi-agent-qa:ci-test bootstrap/src/main/resources/executor/pi
          docker build --build-arg VCS_REF="${{ github.sha }}" -t rd-bot/app:ci-test .
      - name: Compose static config contract
        run: bash scripts/docker/tests/compose_contract_test.sh
      - name: Launcher behavior tests (stubbed docker)
        run: bash scripts/docker/tests/launcher_test.sh
