<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="'Noto Sans SC','PingFang SC',sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1240" height="680" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1240" height="680" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 标题 -->
  <text x="620" y="56" font-size="26" font-weight="700" fill="#1A2233" text-anchor="middle" letter-spacing="2">RdTask 任务状态机流转图</text>
  <text x="620" y="84" font-size="14" fill="#64748B" text-anchor="middle" letter-spacing="1">created → searching → execing → commited → merged · 评审不通过可回环至 execing</text>

  <!-- ====== 状态节点：横向主链 ====== -->
  <!-- 1. created -->
  <g transform="translate(40,250)">
    <rect x="0" y="0" width="180" height="120" rx="16" ry="16" fill="#E8F0FE" stroke="#4A6CF7" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="14" fill="#4A6CF7"/>
    <text x="30" y="35" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="90" y="62" font-size="22" font-weight="700" fill="#1A2233" text-anchor="middle">创建</text>
    <text x="90" y="90" font-size="15" fill="#4A6CF7" text-anchor="middle" font-style="italic">created</text>
    <text x="90" y="110" font-size="11" fill="#64748B" text-anchor="middle">任务落库 · 等待启动</text>
  </g>

  <!-- 2. searching -->
  <g transform="translate(250,250)">
    <rect x="0" y="0" width="180" height="120" rx="16" ry="16" fill="#FFF7E6" stroke="#F5A623" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="14" fill="#F5A623"/>
    <text x="30" y="35" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="90" y="62" font-size="22" font-weight="700" fill="#1A2233" text-anchor="middle">检索</text>
    <text x="90" y="90" font-size="15" fill="#C77C0A" text-anchor="middle" font-style="italic">searching</text>
    <text x="90" y="110" font-size="11" fill="#64748B" text-anchor="middle">RAG 检索 · 组装上下文</text>
  </g>

  <!-- 3. execing -->
  <g transform="translate(460,250)">
    <rect x="0" y="0" width="180" height="120" rx="16" ry="16" fill="#E8F8F1" stroke="#2BB673" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="14" fill="#2BB673"/>
    <text x="30" y="35" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="90" y="62" font-size="22" font-weight="700" fill="#1A2233" text-anchor="middle">执行中</text>
    <text x="90" y="90" font-size="15" fill="#1F8A5B" text-anchor="middle" font-style="italic">execing</text>
    <text x="90" y="110" font-size="11" fill="#64748B" text-anchor="middle">Docker Claude Code 修复</text>
  </g>

  <!-- 4. commited -->
  <g transform="translate(670,250)">
    <rect x="0" y="0" width="180" height="120" rx="16" ry="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="14" fill="#6366F1"/>
    <text x="30" y="35" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="90" y="62" font-size="22" font-weight="700" fill="#1A2233" text-anchor="middle">已提交PR</text>
    <text x="90" y="90" font-size="15" fill="#4F46E5" text-anchor="middle" font-style="italic">commited</text>
    <text x="90" y="110" font-size="11" fill="#64748B" text-anchor="middle">PR 已开 · 等待评审</text>
  </g>

  <!-- 5. merged（终态） -->
  <g transform="translate(950,150)">
    <rect x="0" y="0" width="180" height="120" rx="16" ry="16" fill="#E6F4FB" stroke="#0EA5E9" stroke-width="3"/>
    <circle cx="30" cy="30" r="14" fill="#0EA5E9"/>
    <text x="30" y="35" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="90" y="62" font-size="22" font-weight="700" fill="#1A2233" text-anchor="middle">已合并</text>
    <text x="90" y="90" font-size="15" fill="#0369A1" text-anchor="middle" font-style="italic">merged</text>
    <text x="90" y="110" font-size="11" fill="#64748B" text-anchor="middle">✓ 终态 · 修复闭环</text>
  </g>

  <!-- 6. 不通过（rejected） -->
  <g transform="translate(950,380)">
    <rect x="0" y="0" width="180" height="120" rx="16" ry="16" fill="#FDECEC" stroke="#E5484D" stroke-width="3"/>
    <circle cx="30" cy="30" r="14" fill="#E5484D"/>
    <text x="30" y="35" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
    <text x="90" y="62" font-size="22" font-weight="700" fill="#1A2233" text-anchor="middle">不通过</text>
    <text x="90" y="90" font-size="15" fill="#C23A3E" text-anchor="middle" font-style="italic">rejected</text>
    <text x="90" y="110" font-size="11" fill="#64748B" text-anchor="middle">研发打回 · 评审意见</text>
  </g>

  <!-- ====== 主流转连线（正向，蓝色） ====== -->
  <polyline points="220,310 250,310" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="250,310 242,305 242,315" fill="#3B82F6"/>

  <polyline points="430,310 460,310" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="460,310 452,305 452,315" fill="#3B82F6"/>

  <polyline points="640,310 670,310" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="670,310 662,305 662,315" fill="#3B82F6"/>

  <!-- commited → merged（评审通过，向上） -->
  <polyline points="850,290 920,290 920,240 950,240" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="950,240 942,235 942,245" fill="#2BB673"/>

  <!-- commited → rejected（评审不通过，向下） -->
  <polyline points="850,330 920,330 920,420 950,420" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="950,420 942,415 942,425" fill="#E5484D"/>

  <!-- ====== 边线标签（药丸容器，避免 overflow） ====== -->
  <g transform="translate(810,262)">
    <rect x="0" y="0" width="150" height="26" rx="13" ry="13" fill="#E8F8F1" stroke="#2BB673" stroke-width="1.5"/>
    <text x="75" y="18" font-size="13" font-weight="600" fill="#1F8A5B" text-anchor="middle">✓ 评审通过</text>
  </g>

  <g transform="translate(810,348)">
    <rect x="0" y="0" width="150" height="26" rx="13" ry="13" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5"/>
    <text x="75" y="18" font-size="13" font-weight="600" fill="#C23A3E" text-anchor="middle">✗ 评审不通过</text>
  </g>

  <!-- ====== 回环：rejected → execing（打回重修，单条干净折线） ====== -->
  <polyline points="950,440 540,440 540,370" fill="none" stroke="#E5484D" stroke-width="3" stroke-dasharray="10 6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="540,370 535,378 545,378" fill="#E5484D"/>

  <g transform="translate(670,420)">
    <rect x="0" y="0" width="190" height="26" rx="13" ry="13" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5"/>
    <text x="95" y="18" font-size="13" font-weight="600" fill="#C23A3E" text-anchor="middle">打回重修 · 回到 execing</text>
  </g>

  <!-- ====== 入口/出口标记 ====== -->
  <circle cx="22" cy="310" r="10" fill="#1A2233"/>
  <text x="22" y="292" font-size="11" font-weight="600" fill="#1A2233" text-anchor="middle">start</text>
  <polyline points="32,310 40,310" fill="none" stroke="#1A2233" stroke-width="2.5"/>
  <polygon points="40,310 32,305 32,315" fill="#1A2233"/>

  <circle cx="1218" cy="210" r="12" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <circle cx="1218" cy="210" r="6" fill="#0EA5E9"/>
  <polyline points="1130,210 1206,210" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <polygon points="1206,210 1198,205 1198,215" fill="#0EA5E9"/>

  <!-- ====== 图例 ====== -->
  <g transform="translate(40,560)">
    <rect x="0" y="0" width="1160" height="90" rx="10" ry="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#1A2233">图例</text>

    <line x1="20" y1="55" x2="70" y2="55" stroke="#3B82F6" stroke-width="2.5"/>
    <polygon points="70,55 62,50 62,60" fill="#3B82F6"/>
    <text x="80" y="59" font-size="12" fill="#334155">正向流转</text>

    <line x1="180" y1="55" x2="230" y2="55" stroke="#2BB673" stroke-width="3"/>
    <polygon points="230,55 222,50 222,60" fill="#2BB673"/>
    <text x="240" y="59" font-size="12" fill="#334155">评审通过 → merged（终态）</text>

    <line x1="470" y1="55" x2="520" y2="55" stroke="#E5484D" stroke-width="3"/>
    <polygon points="520,55 512,50 512,60" fill="#E5484D"/>
    <text x="530" y="59" font-size="12" fill="#334155">评审不通过 → rejected</text>

    <line x1="760" y1="55" x2="810" y2="55" stroke="#E5484D" stroke-width="3" stroke-dasharray="10 6"/>
    <polygon points="810,55 802,50 802,60" fill="#E5484D"/>
    <text x="820" y="59" font-size="12" fill="#334155">打回回环 → execing</text>

    <circle cx="990" cy="55" r="9" fill="#4A6CF7"/>
    <text x="990" y="59" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text>
    <text x="1005" y="59" font-size="12" fill="#334155">步骤序号</text>

    <text x="20" y="78" font-size="11" fill="#64748B">说明：状态机覆盖 RdTask 主链路；RdBugFixTask 为首个子类实现。评审不通过不进入终态，可携带评审意见回到 execing 重新修复后再次提交 PR。</text>
  </g>
</svg>
