# Git credential configuration for the RD-Bot backend container.
#
# Referenced via GIT_CONFIG_GLOBAL (see docker-compose.yml). The helper script
# reads the container's GITHUB_PAT environment variable at request time — no
# secret is stored in this file. Scope: github.com over HTTPS only.

[credential "https://github.com"]
	helper = /config/git-credential-helper.sh
