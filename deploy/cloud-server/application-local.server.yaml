# UNSUPPORTED historical example — bare-metal server overlay from the maintainer's
# private deployment. The supported deployment path is the Docker Compose stack
# (see deploy/docker/README.md and README.md). Values below are placeholders; supply
# real credentials only via environment variables or gitignored local files.

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/rdbot?client_encoding=UTF8
    username: postgres
    password: postgres
  data:
    redis:
      host: 127.0.0.1
      port: 6379

rustfs:
  url: http://127.0.0.1:9000
  bucket: biz
  access-key-id: ${RUSTFS_ACCESS_KEY_ID:rustfsadmin}
  secret-access-key: ${RUSTFS_SECRET_ACCESS_KEY:rustfsadmin}

server:
  port: 8080

rd:
  knowledge:
    store: postgres
  storage:
    mode: s3
  distributed-lock:
    mode: redisson
  executor:
    agent-runtime:
      enabled: true
      mutation-token: ${RD_AGENT_RUNTIME_MUTATION_TOKEN:}
    docker:
      enabled: true
      git:
        enabled: true
        timeout-seconds: 600
      security:
        # Replace with the repositories YOU have authorized RD-Bot to operate on.
        repository-urls:
          - https://github.com/example-owner/example-repo.git
        repositories:
          - example-owner/example-repo
    pi:
      credential-relay-enabled: true
      credential-relay-url: ${RD_EXECUTOR_PI_CREDENTIAL_RELAY_URL:http://127.0.0.1:18080/internal/pi/credential-relay/proxy}
      dynamic-state-enabled: true
      container-cpu-limit: 1.5
      container-memory-limit: 1500m
    mock:
      enabled: false
  github:
    merge-sync:
      enabled: false
    code-platform:
      mode: real
      auth-mode: PAT_LOCAL_SMOKE
      # Prefer GITHUB_PAT; fall back to GH_TOKEN.
      pat-token: ${GITHUB_PAT:${GH_TOKEN:}}
  ticket:
    write-back:
      enabled: false
      mode: mock
  feishu:
    im:
      enabled: false
  project-memory:
    worker:
      enabled: false
    reconcile:
      enabled: false
