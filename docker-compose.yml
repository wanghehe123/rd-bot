services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rd-bot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rdbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - rd-bot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rdbot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: rd-bot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio
    container_name: rd-bot-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rustfsadmin
      MINIO_ROOT_PASSWORD: rustfsadmin
    volumes:
      - rd-bot-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc
    container_name: rd-bot-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 rustfsadmin rustfsadmin; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then exit 1; fi;
        sleep 1;
      done;
      mc mb --ignore-existing local/biz;
      exit 0
      "
    restart: "no"

volumes:
  rd-bot-postgres-data:
  rd-bot-minio-data:
